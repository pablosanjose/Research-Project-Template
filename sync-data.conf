# Settings for sync-data.sh, shared by everyone in the project (no personal details here).
#
# REMOTE is an SSH alias, defined in each person's ~/.ssh/config with their own user name.
# Personal overrides (e.g. a different LOCAL_PATH) go in sync-data.local.conf, which is gitignored.

REMOTE=mycluster                              # SSH alias of the cluster
REMOTE_PATH=myproject/data                    # data/ of the repository's clone on the cluster (relative to home)
LOCAL_PATH=data                               # where the data lives in this repository
EXCLUDE=("*.tmp" "scratch/" ".gitkeep")      # patterns not to transfer
